name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TimeFly.App/TimeFly.App.csproj -r win-x64

      - name: Run Unit Tests
        run: dotnet test TimeFly.Tests/TimeFly.Tests.csproj -c Release --verbosity normal

      - name: Publish Lightweight Application
        run: |
          dotnet publish TimeFly.App/TimeFly.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -o ./publish/TimeFly

      - name: Create Portable ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/TimeFly/* -DestinationPath ./TimeFly-windows-x64-portable.zip -CompressionLevel Optimal

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            try {
              choco install nsis.install -y --no-progress
            } catch {
              Write-Warning "Chocolatey install failed, trying winget..."
            }
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
          }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          Write-Host "Building installer with: $makensis"
          & $makensis installer.nsi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimeFly-Release-Binaries
          path: |
            ./TimeFly-Setup-x64.exe
            ./TimeFly-windows-x64-portable.zip

      - name: Generate Changelog and Release Notes
        shell: pwsh
        run: |
          $tag = "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}"
          $version = $tag.TrimStart('v', 'V')
          $changelog = Get-Content -Raw CHANGELOG.md -ErrorAction SilentlyContinue
          $notes = ""
          if ($changelog -and ($changelog -match "(?ms)## \[$tag\][^\n]*\n(.*?)(?=\n## \[|\z)")) {
              $notes = $matches[1].Trim()
          } elseif ($changelog -and ($changelog -match "(?ms)## \[v?$version\][^\n]*\n(.*?)(?=\n## \[|\z)")) {
              $notes = $matches[1].Trim()
          }
          
          # Auto-extract git commit log since previous tag
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $gitLog = ""
          if ($prevTag) {
              $gitLog = git log "${prevTag}..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
              $gitLog = git log -n 10 --pretty=format:"- %s (%h)" --no-merges
          }

          $body = @"
          ### 🎨 TimeFly $tag • Digital Art Focus Tracker

          A modern Windows 11 desktop application designed to track focus time, analyze drawing habits, and help digital artists stay consistent.

          ---

          ### 📜 What's New in $tag
          $notes

          ### 🔨 Commit Changes
          $gitLog

          ---

          ### 📥 Download & Installation

          | Distribution | File | Notes |
          | :--- | :--- | :--- |
          | **Setup Installer (Recommended)** | ``TimeFly-Setup-x64.exe`` | Clean NSIS installer with Start Menu & Desktop shortcuts. |
          | **Portable Edition** | ``TimeFly-windows-x64-portable.zip`` | Lightweight standalone archive. Extract and run ``TimeFly.App.exe``. |

          ---

          **Developer**: [@chiraitori](https://github.com/chiraitori)  
          **Artwork Courtesy**: Pixiv ([Artwork ID: 148639751](https://www.pixiv.net/en/artworks/148639751))
          "@
          Set-Content -Path release_body.md -Value $body

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          name: TimeFly ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          body_path: release_body.md
          generate_release_notes: true
          files: |
            ./TimeFly-Setup-x64.exe
            ./TimeFly-windows-x64-portable.zip
          draft: false
          prerelease: false
